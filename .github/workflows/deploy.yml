name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    name: Trigger Vercel + Render deploy
    runs-on: ubuntu-latest
    # Only deploy when CI passed on main; never deploy on a failed or cancelled run
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Trigger Render deploy (API)
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "RENDER_DEPLOY_HOOK not configured — skipping"
          else
            curl --silent --show-error --fail \
              -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Render deploy triggered"
          fi

      - name: Trigger Vercel deploy (web)
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "VERCEL_DEPLOY_HOOK not configured — skipping"
          else
            curl --silent --show-error --fail \
              -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
            echo "Vercel deploy triggered"
          fi
